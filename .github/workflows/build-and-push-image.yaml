name: Build and Push Image

on:
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest

    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}

    permissions:
      contents: read
      packages: write  # important: needed to push to GHCR
      id-token: write  # optional: for improved auth

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Generate GCP-compatible timestamp tag (ts-YYYYMMDD-HHMMSS)
      - name: Set timestamp tag
        id: set-tag
        run: |
          echo "tag=ts-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image with the timestamp tag
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.set-tag.outputs.tag }} .

      # Push the image to GHCR using the timestamp tag
      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.set-tag.outputs.tag }}

